name = "hex-poly-fp"
defaultTargets = ["HexPolyFp"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexModular"
git = "https://github.com/leanprover/hex-modular.git"
rev = "v0.8.0"

[[require]]
name = "HexPoly"
git = "https://github.com/leanprover/hex-poly.git"
rev = "v0.8.0"

[[require]]
name = "HexPolyFast"
git = "https://github.com/leanprover/hex-poly-fast.git"
rev = "v0.8.0"

[[require]]
name = "HexModArith"
git = "https://github.com/leanprover/hex-mod-arith.git"
rev = "v0.8.0"

[[lean_lib]]
name = "HexPolyFp"
precompileModules = true
