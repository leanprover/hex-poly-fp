name = "hex-poly-fp-conformance"
defaultTargets = ["HexPolyFpConformance", "hexpolyfp_emit_fixtures"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexPolyFp"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "26e3c46c6263b741a6e1fdaf5e5fc03832ec5b79"

[[lean_lib]]
name = "HexPolyFpConformance"
globs = ["HexPolyFp.Conformance"]

[[lean_exe]]
name = "hexpolyfp_emit_fixtures"
root = "HexPolyFp.EmitFixtures"
